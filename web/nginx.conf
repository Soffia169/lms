# nginx для web-интерфейса LMS.
#
# Задача конфигурации — сделать UI и API одним origin:
#   /            → статика SPA (index.html + css/js)
#   /api/...     → gateway-service:8080 (тот же путь, без переписывания)
#   /healthz     → /actuator/health gateway (индикатор в подвале UI)
#
# Один origin снимает необходимость в CORS для основного сценария: браузер
# видит и статику, и API на http://localhost:8088.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Логи контейнера — в stdout/stderr (docker compose logs web).
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Docker DNS: имя gateway-service резолвится на каждый запрос,
    # поэтому перезапуск gateway не требует перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway gateway-service:8080;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Индикатор доступности gateway для подвала интерфейса.
    location = /healthz {
        proxy_pass http://$gateway/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # API: путь не меняется, gateway сам знает /api/auth/** и /api/courses/**.
    location /api/ {
        proxy_pass http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-User-* от клиента не пробрасываем: gateway сам вырезает их и
        # проставляет по проверенному JWT (defense in depth).
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    # Статика SPA. Хеш-роутинг не требует rewrite, но fallback безопасен.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты можно кешировать недолго: файлы не хешируются, поэтому
    # агрессивный immutable-cache привёл бы к устаревшему UI.
    location ~* \.(?:css|js)$ {
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~ /\. {
        deny all;
    }
}
