server:
  port: 8080

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:lms}
    password: ${SPRING_DATASOURCE_PASSWORD:lms_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:lms}
    password: ${SPRING_RABBITMQ_PASSWORD:lms_password}

lms:
  events:
    topology-enabled: true
    outbox:
      enabled: true
      batch-size: 100
      delay-ms: 1000
  security:
    # Публичные endpoint-ы auth-service: регистрация, вход, обновление токена и ключи.
    additional-public-paths:
      - /api/auth/register
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/.well-known/**
  auth:
    jwt:
      issuer: lms-auth
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      # В контейнере каталог смонтирован томом; локально создаётся в ./keys
      key-dir: ${LMS_AUTH_JWT_KEYDIR:keys}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
