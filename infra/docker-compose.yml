# Локальный стек LMS: PostgreSQL 17, RabbitMQ 4 и сервисы этапа 2
# (auth, course, enrollment, notification, gateway) + web-интерфейс на nginx.
#
#   cd infra
#   cp .env.example .env      # опционально: без .env работают значения по умолчанию
#   docker compose up -d --build
#
#   docker compose ps
#   docker compose exec postgres psql -U lms -l
#   docker compose down -v    # удалить данные и пересоздать 6 БД при следующем up
#
# Web UI: http://localhost:8088 (nginx проксирует /api на gateway:8080)

name: lms

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      # Данные лежат в подкаталоге: том монтируется в /var/lib/postgresql/data
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lms-net

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-lms}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lms_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - lms-net

  # --- Сервисы приложения (этап 2) ---
  # Порты 8081–8084 опубликованы для отладки. По плану после доработок
  # наружу останется только gateway:8080 (см. README).
  auth-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-lms}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lms_password}
    ports:
      - "8081:8080"
    volumes:
      # Ключи RS256 переживают пересоздание контейнера
      - auth-keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - lms-net

  course-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: course-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/course_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      AUTH_JWKS_URI: http://auth-service:8080/api/auth/.well-known/jwks.json
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-lms}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lms_password}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - lms-net

  enrollment-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: enrollment-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enrollment_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      AUTH_JWKS_URI: http://auth-service:8080/api/auth/.well-known/jwks.json
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-lms}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lms_password}
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - lms-net

  notification-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: notification-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lms}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      AUTH_JWKS_URI: http://auth-service:8080/api/auth/.well-known/jwks.json
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-lms}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-lms_password}
    ports:
      - "8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - lms-net

  gateway-service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: gateway-service
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8080
      COURSE_SERVICE_URL: http://course-service:8080
      ENROLLMENT_SERVICE_URL: http://enrollment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      AUTH_JWKS_URI: http://auth-service:8080/api/auth/.well-known/jwks.json
      # CORS нужен только для разработки UI отдельным сервером (docs/UI.md).
      # В основном сценарии nginx отдаёт статику и API с одного origin.
      LMS_CORS_ALLOWED_ORIGINS: ${LMS_CORS_ALLOWED_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088,http://localhost:5500,http://127.0.0.1:5500}
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      enrollment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - lms-net

  # --- Web-интерфейс (этап 1) ---
  # nginx отдаёт статику SPA и проксирует /api на gateway, поэтому браузер
  # работает с одним origin: http://localhost:8088
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      # busybox wget есть в nginx:alpine — curl в образе отсутствует.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - lms-net

volumes:
  postgres-data:
    name: lms-postgres-data
  rabbitmq-data:
    name: lms-rabbitmq-data
  auth-keys:
    name: lms-auth-keys

networks:
  lms-net:
    name: lms-net
    driver: bridge
